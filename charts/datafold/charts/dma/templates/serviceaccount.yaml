{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dma.names.serviceaccount" . }}
  labels:
    {{- include "dma.labels" . | nindent 4 }}
    {{- include "dma.templatelabels" . | nindent 4 }}
    {{- with .Values.chartLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
    {{- if (eq .Values.global.cloudProvider "aws") }}
    {{- if .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
    {{- end }}
    {{- end }}
    {{- if (eq .Values.global.cloudProvider "gcp") }}
    {{- if .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount }}
    {{- end }}
    {{- end }}
    {{- if (eq .Values.global.cloudProvider "azure") }}
    {{- if .Values.serviceAccount.azureClientId }}
    azure.workload.identity/client-id: {{ .Values.serviceAccount.azureClientId }}
    {{- end }}
    {{- if .Values.serviceAccount.azureTenantId }}
    azure.workload.identity/tenant-id: {{ .Values.serviceAccount.azureTenantId }}
    {{- end }}
    {{- end }}
    {{- with .Values.chartAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
