replicaCount: 1

image:
  pullPolicy: Always
  tagOverride: ""

imagePullSecrets:
  - name: datafold-docker-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  roleArn: ""
  gcpServiceAccount: ""
  azureClientId: ""
  azureTenantId: ""
  name: "datafold-manager"

podAnnotations: {}
podLabels: {}

chartLabels: {}
chartAnnotations: {}

# When set, skip creating the ClusterRole and instead bind to this existing one.
# Used for secondary deployments where the primary release owns the ClusterRole.
existingClusterRoleName: ""

podSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false

resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}

initContainers: []

# Extra env vars appended to the operator container - e.g. HTTP_PROXY/HTTPS_PROXY/NO_PROXY
# for clusters where portal.datafold.com isn't directly reachable. Set via DatafoldApplication
# components.operator.rawValues.extraEnv. Empty by default - no-op for every deployment that
# doesn't set it.
extraEnv: []
