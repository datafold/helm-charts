replicaCount: 1

image:
  repository: datadog/datadog
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP

resources: {}

autoscaling:
  enabled: false

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

configuration:
  logLevel: "INFO"
  logCollection:
    enabled: "true"
    containerCollectAll: "true"
  liveProcessCollection: "true"
  liveContainerCollection: "true"
  processDiscovery: "true"
  oomKill: "true"
  orchestratorExplorer: "true"
  apm: "false"
  dogstatsd:
    enabled: "true"
    hostPortConfig: "true"
    tagCardinality: "low"
  # Tag cardinality for Autodiscovery/integration checks (DD_CHECKS_TAG_CARDINALITY).
  # "low" trims higher-cardinality orchestrator tags (e.g. pod_name, kube_replica_set)
  # that the tagger would otherwise attach to scraped metrics such as temporal_worker.*.
  # dogstatsd.tagCardinality above only governs DogStatsD metrics, so checks are set here.
  checksTagCardinality: "low"
  monitorPostgres: false
  monitorKeda: false
  monitorTemporal: false
  clusterChecks: true
  npm:
    enabled: "false"
    dnsstats: "false"
  # HTTP(S) proxy for the node agent and cluster agent's own outbound traffic to the
  # Datadog backend (not to be confused with node-level containerd/image-pull proxying,
  # which is handled outside this chart). Set via DatafoldApplication
  # monitoring.datadog.proxy.{http,https,noProxy}. Empty by default - no-op for every
  # deployment that doesn't set it.
  proxy:
    http: ""
    https: ""
    noProxy: []
  # The node agent's OTLP receiver (DatadogAgent features.otlp), for pods that push
  # OpenTelemetry metrics and traces to the agent on their own node: Butterfly does.
  # Set via DatafoldApplication monitoring.datadog.otlpReceiver.{http,grpc}. The
  # Datadog operator adds the port to its node-local Service (`<fullname>-agent`,
  # internalTrafficPolicy Local): 4318 for HTTP, 4317 for gRPC. Turning it on also
  # makes the agent tag OTLP metrics with their resource attributes. Traces need
  # `apm` on as well: the agent hands OTLP spans to the trace-agent, and without
  # one it refuses them (the sender sees a timeout). Logs over OTLP stay off (no
  # DD_OTLP_CONFIG_LOGS_ENABLED); container logs come from stdout. Off by
  # default - no-op for every deployment that doesn't set it.
  otlp:
    http: false
    grpc: false

# Extra Kubernetes namespaces to include for container log and metric collection
# (in addition to the release namespace, temporal, and dmadocs). Set via DatafoldApplication
# monitoring.datadog.containerIncludeExtraNamespaces (e.g. ["arc-runners", "arc-system"]).
containerIncludeExtraNamespaces: []
