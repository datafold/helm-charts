replicaCount: 1

image:
  repository: memgraph/memgraph
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
terminationGracePeriodSeconds: 60
snapshotRetentionCount: 32

# Service accounts allowed to exec into Memgraph pods to pull snapshot files
# for off-cluster DR backups (e.g. [worker-temporal]). Empty = no RBAC rendered.
backupAccessServiceAccounts: []

# Service accounts granted RBAC to scale this StatefulSet. Runtime per-org DKG
# graph provisioning patches the replica count from these pods
# (knowledge_graph/registry.py). Empty list disables the Role/RoleBinding.
scaleAccessServiceAccounts:
  - dma
  - dfshell

storage:
  dataSize: 50Gi
  storageClass: ""
  volumeId: ""

podAnnotations: {}

chartLabels: {}
chartAnnotations: {}

podSecurityContext:
  fsGroup: 103

securityContext:
  allowPrivilegeEscalation: false

initSecurityContext:
  runAsUser: 0
  runAsGroup: 0

service:
  type: ClusterIP
  port: 7687

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 4Gi

nodeSelector: {}

tolerations: []

affinity: {}
